<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MovieHub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      padding: 18px;
      background: #15151d;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .logo span {
      color: #e50914;
    }

    .search {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #252530;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .container {
      padding: 20px;
    }

    h2 {
      margin-bottom: 15px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 25px;
    }

    .category {
      background: #252530;
      padding: 10px 16px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .category:hover {
      background: #e50914;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .movie {
      background: #17171f;
      border-radius: 10px;
      overflow: hidden;
    }

    .movie img {
      
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .movie-info {
      padding: 12px;
    }

    .movie-title {
      font-size: 16px;
      font-weight: bold;
    }

    .rating {
      color: #ffc107;
      margin-top: 7px;
    }

    @media (min-width: 700px) {
      .movies {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    Movie<span>Hub</span>
  </div>

  <input
    class="search"
    type="text"
    placeholder="Movie search करें..."
  >

</header>

<main class="container">

  <h2>Categories</h2>

  <div class="categories">

    <div class="category">All</div>
    <div class="category">Bollywood</div>
    <div class="category">Hollywood</div>
    <div class="category">South</div>
    <div class="category">Web Series</div>

  </div>

  <h2>Latest Movies</h2>

  <div class="movies"></div>

</main>

<script src="movies.js"></script>
<script src="script.js"></script>

</body>
</html>
